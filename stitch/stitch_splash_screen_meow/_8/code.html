roke-current stroke-2 group-hover:scale-110 transition-transform" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path><circle cx="8.5" cy="11.5" fill="currentColor" r="1"></circle><circle cx="12" cy="11.5" fill="currentColor" r="1"></circle><circle cx="15.5" cy="11.5" fill="currentColor" r="1"></circle></svg></div></button><!-- Tab 4: العيادة (Clinic / Medical Kit) --><button aria-label="العيادة" class="flex items-center justify-center p-1 rounded-full text-brand-subtleGray hover:text-brand-orange transition-all active:scale-90 group" type="button"><div class="w-12 h-12 rounded-full flex items-center justify-center hover:bg-brand-peachBorder/20 transition-all"><svg class="w-7 h-7 fill-none stroke-current stroke-2 group-hover:scale-110 transition-transform" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect height="15" rx="3" width="18" x="3" y="6"></rect><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"></path><path d="M12 10v7M8.5 13.5h7" stroke-width="2.5"></path></svg></div></button><!-- Tab 5: المتجر (Store / Storefront) --><button aria-label="المتجر" class="flex items-center justify-center p-1 rounded-full text-brand-orange transition-all active:scale-90 group" type="button"><div class="w-12 h-12 rounded-full bg-gradient-to-tr from-brand-orange to-brand-accent text-white flex items-center justify-center shadow-soft hover:shadow-card transition-all"><svg class="w-7 h-7 fill-none stroke-current stroke-2 drop-shadow-sm" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9l1.5-6h15L21 9M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0M3 9v11a2 2 0 002 2h14a2 2 0 002-2V9"></path><path d="M10 14h4v4h-4z" fill="currentColor" fill-opacity="0.2"></path></svg></div></button><!-- Tab 6: الملف الشخصي (Profile / User) --><button aria-l </nav><script>
  function filterPets(category, activeBtn) {
    document.querySelectorAll('.category-tab').forEach(btn => {
      btn.classList.remove('bg-brand-orange', 'text-white', 'shadow-soft', 'border-brand-orange');
      btn.classList.add('bg-white', 'border-brand-peachBorder', 'text-brand-dark');
    });
    activeBtn.classList.remove('bg-white', 'border-brand-peachBorder', 'text-brand-dark');
    activeBtn.classList.add('bg-brand-orange', 'text-white', 'shadow-soft', 'border-brand-orange');

    const cards = document.querySelectorAll('.pet-card');
    cards.forEach(card => {
      const type = card.getAttribute('data-pet-type');
      if (category === 'all' || type === category) {
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function setView(mode) {
    const grid = document.querySelector("[data-purpose='pet-listings-grid']");
    const btnGrid = document.getElementById('btn-grid-view');
    const btnList = document.getElementById('btn-list-view');
    if (!grid) return;

    if (mode === 'grid') {
      grid.classList.remove('grid-cols-1');
      grid.classList.add('grid-cols-2');
      btnGrid.className = 'h-9 px-3 rounded-xl bg-brand-orange text-white flex items-center justify-center shadow-sm transition-all active:scale-95';
      btnList.className = 'h-9 px-3 rounded-xl text-brand-dark/70 hover:bg-white/70 flex items-center justify-center transition-all active:scale-95';
    } else {
      grid.classList.remove('grid-cols-2');
      grid.classList.add('grid-cols-1');
      btnList.className = 'h-9 px-3 rounded-xl bg-brand-orange text-white flex items-center justify-center shadow-sm transition-all active:scale-95';
      btnGrid.className = 'h-9 px-3 rounded-xl text-brand-dark/70 hover:bg-white/70 flex items-center justify-center transition-all active:scale-95';
    }
  }

  function toggleFilterBadge() {
    const badge = document.getElementById('filter-badge');
    if (badge) {
      badge.style.display = badge.style.display === 'none' ? 'flex' : 'none';
    }
  }

  function toggleFavorite(button) {
    const icon = button.querySelector('i');
    if (icon) {
      if (icon.classList.contains('fa-regular')) {
        icon.classList.remove('fa-regular');
        icon.classList.add('fa-solid', 'text-red-500');
        button.classList.add('bg-white');
        button.classList.remove('bg-brand-dark/40');
      } else {
        icon.classList.remove('fa-solid', 'text-red-500');
        icon.classList.add('fa-regular');
        button.classList.remove('bg-white');
        button.classList.add('bg-brand-dark/40');
      }
    }
  }

  /* Intelligent Velocity-based Header Hide & Reveal */
  (function initSmartHeaderScroll() {
    const header = document.getElementById('main-header');
    if (!header) return;

    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    let lastTime = performance.now();
    let scrollStopTimer = null;

    window.addEventListener('scroll', () => {
      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
      const currentTime = performance.now();
      const deltaY = currentScrollY - lastScrollY;
      const deltaTime = Math.max(currentTime - lastTime, 1);
      const velocity = deltaY / deltaTime; // px per ms

      // Fast scroll down (velocity > 1.2 px/ms and scrolled past header height)
      if (velocity > 1.2 && currentScrollY > 100) {
        header.classList.add('header-hidden');
      } 
      // Any upward scroll immediately restores header
      else if (deltaY < -2 || currentScrollY <= 20) {
        header.classList.remove('header-hidden');
      }

      // When user stops scrolling, automatically restore header smoothly
      clearTimeout(scrollStopTimer);
      scrollStopTimer = setTimeout(() => {
        header.classList.remove('header-hidden');
      }, 150);

      lastScrollY = currentScrollY;
      lastTime = currentTime;
    }, { passive: true });
  })();
</script>
