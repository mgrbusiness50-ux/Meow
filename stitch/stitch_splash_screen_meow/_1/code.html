utton">هادئ</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="لطيف" onclick="toggleTrait(this)" type="button">لطيف</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="مرح" onclick="toggleTrait(this)" type="button">مرح</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="شجاع" onclick="toggleTrait(this)" type="button">شجاع</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="مخلص" onclick="toggleTrait(this)" type="button">مخلص</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="نشيط" onclick="toggleTrait(this)" type="button">نشيط</button><button class="trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-6 py-3.5 font-black text-lg transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50 shadow-sm flex items-center justify-center" data-trait="اجتماعي" onclick="toggleTrait(this)" type="button">اجتماعي</button></div>

<!-- Footer Spacer -->

<script>
  const catBreeds = [
    'بلدي (ماو مصري)',
    'شيرازي (فارسي)',
    'سيامي',
    'هيمالايا',
    'سكوتش فولد',
    'بريطاني قصير الشعر',
    'راغدول',
    'مين كون',
    'بنغالي',
    'سفينكس (الفرعوني)',
    'حبشي',
    'روسي أزرق',
    'تركي أنغورا',
    'بيرمان',
    'أمريكي قصير الشعر',
    'نرويجي غابات',
    'كورنيش ريكس',
    'ديفون ريكس',
    'بومباي',
    'صومالي',
    'تونكينيز',
    'مانكس',
    'سيبيري',
    'بورمي',
    'شرقي قصير الشعر',
    'هجين / مختلط',
    'سلالة أخرى'
  ];

  const dogBreeds = [
    'بلدي',
    'جيرمن شيبرد (الراعي الألماني)',
    'غولدن ريتريفر',
    'لابرادور ريتريفر',
    'هاسكي سيبيري',
    'روتوايلر',
    'بيت بول',
    'دوبرمان',
    'بولدوغ فرنسي',
    'كان كورسو',
    'شيواوا',
    'مالينوا بلجيكي',
    'بوكسر',
    'شيتزو',
    'يوركشاير ترير',
    'بودل',
    'داشهوند',
    'بيغل',
    'سامويد',
    'جريت دان',
    'سانت برنارد',
    'شار بي',
    'بوسطن ترير',
    'أكيتا',
    'هجين / مختلط',
    'سلالة أخرى'
  ];

  function updateBreedOptions(type) {
    const breedSelect = document.getElementById('petBreed');
    if (!breedSelect) return;
    const breeds = type === 'dog' ? dogBreeds : catBreeds;
    const defaultSelected = type === 'dog' ? 'بلدي' : 'شيرازي (فارسي)';
    breedSelect.innerHTML = breeds.map(breed => `<option value="${breed}" ${breed === defaultSelected ? 'selected' : ''}>${breed}</option>`).join('');
  }

  const defaultInactiveClass = 'relative flex items-center justify-center gap-2 rounded-[28px] border-2 border-[#d6c7b2] bg-[#ffffff] text-[#786555] font-bold cursor-pointer shadow-sm transition-all active:scale-[0.98]';

  // Pet Type Handler
  function setPetType(type) {
    const catBtn = document.getElementById('type-cat-btn');
    const dogBtn = document.getElementById('type-dog-btn');
    const input = document.getElementById('pet-type-input');
    if (input) input.value = type;

    const catActiveClass = 'h-16 relative flex items-center justify-center gap-2.5 px-4 rounded-[28px] border-2 border-[#e67e22] bg-[#fff5ea] text-[#e67e22] font-extrabold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const dogActiveClass = 'h-16 relative flex items-center justify-center gap-2 px-4 rounded-[28px] border-2 border-[#e67e22] bg-[#fff5ea] text-[#e67e22] font-extrabold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const inactiveClass = 'h-16 ' + defaultInactiveClass + ' text-xl px-4';

    if (type === 'cat') {
      if (catBtn) catBtn.className = catActiveClass;
      if (dogBtn) dogBtn.className = inactiveClass;
    } else {
      if (dogBtn) dogBtn.className = dogActiveClass;
      if (catBtn) catBtn.className = inactiveClass;
    }

    updateBreedOptions(type);
  }

  // Gender Selection Handler
  function setPetGender(gender) {
    const maleBtn = document.getElementById('gender-male-btn');
    const femaleBtn = document.getElementById('gender-female-btn');
    const input = document.getElementById('gender-input');
    if (input) input.value = gender;

    const maleActiveClass = 'h-16 relative flex items-center justify-center gap-2 px-5 rounded-[28px] border-2 border-[#3b82f6] bg-[#eff6ff] text-[#2563eb] font-bold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const femaleActiveClass = 'h-16 relative flex items-center justify-center gap-2 px-5 rounded-[28px] border-2 border-[#ec4899] bg-[#fce7f3] text-[#db2777] font-bold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const inactiveClass = 'h-16 ' + defaultInactiveClass + ' text-xl px-5';

    if (gender === 'male') {
      if (maleBtn) maleBtn.className = maleActiveClass;
      if (femaleBtn) femaleBtn.className = inactiveClass;
    } else {
      if (femaleBtn) femaleBtn.className = femaleActiveClass;
      if (maleBtn) maleBtn.className = inactiveClass;
    }
  }

  // Vaccination Handler
  function setVaccination(status) {
    const yesBtn = document.getElementById('vax-yes-btn');
    const noBtn = document.getElementById('vax-no-btn');
    const input = document.getElementById('vaccination-input');
    if (input) input.value = status;

    const yesActiveClass = 'h-16 relative flex items-center justify-center gap-1.5 px-2 rounded-[28px] border-2 border-[#10b981] bg-[#ecfdf5] text-[#059669] font-bold text-base cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const noActiveClass = 'h-16 relative flex items-center justify-center gap-1.5 px-2 rounded-[28px] border-2 border-[#ea580c] bg-[#fff7ed] text-[#c2410c] font-bold text-base cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const inactiveClass = 'h-16 ' + defaultInactiveClass + ' text-base px-2';

    if (status === 'yes') {
      if (yesBtn) yesBtn.className = yesActiveClass;
      if (noBtn) noBtn.className = inactiveClass;
    } else {
      if (noBtn) noBtn.className = noActiveClass;
      if (yesBtn) yesBtn.className = inactiveClass;
    }
  }

  // Personality Traits Handler
  const selectedTraits = new Set();
  const maxTraits = 6;

  function toggleTrait(btn) {
    const trait = btn.getAttribute('data-trait');
    const limitMsg = document.getElementById('trait-limit-msg');
    
    if (selectedTraits.has(trait)) {
      selectedTraits.delete(trait);
      btn.className = 'trait-chip rounded-full border-2 border-[#d6c7b2] bg-[#fffefc] text-[#6d5b4c] px-3.5 py-1.5 font-bold text-sm transition-all cursor-pointer select-none active:scale-95 hover:border-[#e67e22]/50';
      if (limitMsg) limitMsg.classList.add('hidden');
    } else {
      if (selectedTraits.size >= maxTraits) {
        if (limitMsg) {
          limitMsg.classList.remove('hidden');
          setTimeout(() => limitMsg.classList.add('hidden'), 2500);
        }
        return;
      }
      selectedTraits.add(trait);
      btn.className = 'trait-chip rounded-full border-2 border-[#e67300] bg-[#fff2e2] text-[#c25807] font-black px-3.5 py-1.5 text-sm transition-all cursor-pointer select-none shadow-sm active:scale-95 ring-2 ring-[#e67300]/20';
      if (limitMsg) limitMsg.classList.add('hidden');
    }

    const counter = document.getElementById('traits-counter');
    if (counter) {
      counter.textContent = `المحدد: ${selectedTraits.size} من ${maxTraits}`;
      if (selectedTraits.size >= 3) {
        counter.className = 'text-xs font-black px-2.5 py-1 rounded-full bg-[#ecfdf5] text-[#059669] transition-all';
      } else {
        counter.className = 'text-xs font-black px-2.5 py-1 rounded-full bg-[#faecd8] text-[#c25807] transition-all';
      }
    }
  }
</script>
