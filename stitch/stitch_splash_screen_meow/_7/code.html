<!-- Main Content: Form -->

<!-- رقم الهاتف -->

<div class="relative flex items-center h-16" dir="ltr">

</div>
</div>
<!-- الجنس -->

<label class="block text-base font-bold text-[#2d221b]">الجنس</label>
<div class="grid grid-cols-2 gap-3.5">
<!-- Male Option Button -->
<button class="h-16 relative flex items-center justify-center gap-2 px-5 rounded-[28px] border-2 border-[#d6c7b2] bg-[#ffffff] text-[#786555] font-bold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]" id="gender-male-btn" onclick="setGender('male')" type="button"><span class="text-2xl">♂</span><span class="">ذكر</span></button>
<!-- Female Option Button -->
<button class="h-16 relative flex items-center justify-center gap-2 px-5 rounded-[28px] border-2 border-[#ec4899] bg-[#fce7f3] text-[#db2777] font-bold text-xl cursor-pointer shadow-sm transition-all active:scale-[0.98]" id="gender-female-btn" onclick="setGender('female')" type="button"><span class="text-2xl">♀</span><span class="">أنثى</span></button>
<input id="gender-input" name="gender" type="hidden" value="female">
</div>
</div>
<!-- المحافظة والحي -->
<div class="grid grid-cols-2 gap-3.5">
<!-- المحافظة -->
<div class="space-y-2">
<label class="block text-base font-bold text-[#2d221b]">المحافظة</label>

</div>
</div>
<!-- المدينة / الحي -->
<div class="space-y-2">
<label class="block text-base font-bold text-[#2d221b]">المدينة / الحي</label>
<div class="relative flex items-center h-16">
<select class="w-full h-full px-5 bg-[#fffefc] border-2 border-[#d6c7b2] rounded-[28px] text-lg font-bold text-center text-[#1a1612] focus:outline-none focus:ring-4 focus:ring-[#e67e22]/20 focus:border-[#e67e22] transition-all shadow-sm appearance-none cursor-pointer" id="citySelect"><option value="مدينة نصر">مدينة نصر</option><option value="مصر الجديدة">مصر الجديدة</option><option value="التجمع الخامس / القاهرة الجديدة">التجمع الخامس / القاهرة الجديدة</option><option value="المعادي">المعادي</option><option value="الزمالك">الزمالك</option><option value="الدقي / وسط البلد">الدقي / وسط البلد</option><option value="شبرا">شبرا</option><option value="حلوان">حلوان</option><option value="المقطم">المقطم</option><option value="عين شمس">عين شمس</option></select>

</div>
</div>
</div>
<!-- CTA Button -->
<div class="pt-5">
<button class="w-full h-16 px-6 text-white bg-[#e67e22] hover:bg-[#ea580c] rounded-[28px] font-extrabold text-2xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer" type="submit"><span class="">اشطا</span></button>

<!-- Footer Spacer -->
<footer class="w-full max-w-md pb-6 text-center"></footer>
<script>
  // Comprehensive Governorates & Cities Data for Egypt (All 27 Governorates)
  const egyptData = {
    "القاهرة": ["مدينة نصر", "مصر الجديدة", "التجمع الخامس / القاهرة الجديدة", "المعادي", "الزمالك", "الدقي / وسط البلد", "شبرا", "حلوان", "المقطم", "عين شمس"],
    "الجيزة": ["الدقي", "المهندسين", "6 أكتوبر", "الشيخ زايد", "الهرم", "فيصل", "العجوزة", "العمرانية", "الحوامدية"],
    "الإسكندرية": ["سموحة", "سيدي جابر", "لوران", "جليم", "ميامي", "المنتزه", "العجمي", "الرمل", "الإبراهيمية"],
    "القليوبية": ["بنها", "شبرا الخيمة", "قلیوب", "العبور", "طوخ", "القناطر الخيرية"],
    "الدقهلية": ["المنصورة", "ميت غمر", "طلخا", "دكرنس", "بلقاس", "السنبلاوين"],
    "الغربية": ["طنطا", "المحلة الكبرى", "زفتى", "كفر الزيات", "سمنود"],
    "الشرقية": ["الزقازيق", "العاشر من رمضان", "بلبيس", "منيا القمح", "فاقوس"],
    "المنوفية": ["شبين الكوم", "قويسنا", "أشمون", "منوف", "السادات", "بركة السبع"],
    "البحيرة": ["دمنهور", "كفر الدوار", "إيتاي البارود", "رشيد", "أبو حمص"],
    "كفر الشيخ": ["كفر الشيخ", "دسوق", "فوة", "مطوبس", "بلطيم"],
    "دمياط": ["دمياط", "رأس البر", "دمياط الجديدة", "فارسكور", "كفر سعد"],
    "بورسعيد": ["حي الشرق", "حي بورفؤاد", "حي العرب", "حي الضواحي", "حي الزهور"],
    "الإسماعيلية": ["الإسماعيلية", "فايد", "القنطرة غرب", "القنطرة شرق", "التل الكبير"],
    "السويس": ["حي السويس", "الأربعين", "فيصل", "الجناين", "عتاقة"],
    "شمال سيناء": ["العريش", "بئر العبد", "الشيخ زويد", "رفح", "الحسنة"],
    "جنوب سيناء": ["شرم الشيخ", "دهب", "نويبع", "طور سيناء", "طابا", "رأس سدر"],
    "بني سويف": ["بني سويف", "بني سويف الجديدة", "الواسطى", "ناصر", "ببا"],
    "الفيوم": ["الفيوم", "سنورس", "إطسا", "طامية", "يوسف الصديق"],
    "المنيا": ["المنيا", "المنيا الجديدة", "ملوي", "مغاغة", "بني مزار", "سمالوط"],
    "أسيوط": ["أسيوط", "أسيوط الجديدة", "ديروط", "القوصية", "منفلوط", "أبنوب"],
    "سوهاج": ["سوهاج", "سوهاج الجديدة", "أخميم", "جرجا", "طهطا", "المراغة"],
    "قنا": ["قنا", "قنا الجديدة", "نجع حمادي", "دشنا", "قوص", "فرشوط"],
    "الأقصر": ["الأقصر", "البياضية", "القرنة", "أرمنت", "إسنا", "طيبة الجديدة"],
    "أسوان": ["أسوان", "أسوان الجديدة", "كوم أمبو", "إدفو", "نصر النوبة", "دراو"],
    "البحر الأحمر": ["الغردقة", "الجونة", "سفاجا", "القصير", "مرسى علم", "رأس غارب"],
    "الالوادي الجديد": ["الخارجة", "الداخلة", "الفرافرة", "باريس", "بلاط"],
    "الوادي الجديد": ["الخارجة", "الداخلة", "الفرافرة", "باريس", "بلاط"],
    "مطروح": ["مرسى مطروح", "العلمين", "الساحل الشمالي", "سيوة", "الضبعة"]
  };

  // Gender Selection handler
  function setGender(val) {
    const maleBtn = document.getElementById('gender-male-btn');
    const femaleBtn = document.getElementById('gender-female-btn');
    const input = document.getElementById('gender-input');

    if (input) input.value = val;

    const unselectedClasses = 'h-14 relative flex items-center justify-center gap-2 px-4 rounded-2xl border-2 border-[#d6c7b2] bg-[#ffffff] text-[#786555] font-bold text-lg cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const maleSelectedClasses = 'h-14 relative flex items-center justify-center gap-2 px-4 rounded-2xl border-2 border-[#3b82f6] bg-[#e8f1fc] text-[#2563eb] font-bold text-lg cursor-pointer shadow-sm transition-all active:scale-[0.98]';
    const femaleSelectedClasses = 'h-14 relative flex items-center justify-center gap-2 px-4 rounded-2xl border-2 border-[#ec4899] bg-[#fce7f3] text-[#db2777] font-bold text-lg cursor-pointer shadow-sm transition-all active:scale-[0.98]';

    if (val === 'male') {
      if (maleBtn) maleBtn.className = maleSelectedClasses;
      if (femaleBtn) femaleBtn.className = unselectedClasses;
    } else if (val === 'female') {
      if (femaleBtn) femaleBtn.className = femaleSelectedClasses;
      if (maleBtn) maleBtn.className = unselectedClasses;
    }
  }

  // Populate Governorates and Cities
  function populateLocations() {
    const govSelect = document.getElementById('govSelect');
    const citySelect = document.getElementById('citySelect');
    if (!govSelect || !citySelect) return;

    // Filter unique keys from egyptData
    const governorates = Object.keys(egyptData).filter(g => g !== 'الالوادي الجديد');

    govSelect.innerHTML = '';
    governorates.forEach((gov, index) => {
      const opt = document.createElement('option');
      opt.value = gov;
      opt.textContent = gov;
      if (gov === 'القاهرة') opt.selected = true;
      govSelect.appendChild(opt);
    });

    function updateCities(selectedGov) {
      const cities = egyptData[selectedGov] || [];
      citySelect.innerHTML = '';
      cities.forEach((city, index) => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        if (index === 0) opt.selected = true;
        citySelect.appendChild(opt);
      });
    }

    // Initial setup with Cairo
    updateCities('القاهرة');

    // Event listener for changes
    govSelect.addEventListener('change', function () {
      updateCities(this.value);
    });
  }

  // Bind Listeners
  document.addEventListener('DOMContentLoaded', () => {
    populateLocations();
  });

  // Run immediately in case DOM is already parsed
  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    populateLocations();
  }
</script>
