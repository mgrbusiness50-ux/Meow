name: Build Meow Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing required GitHub Secrets: VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY must be configured in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          case "${VITE_SUPABASE_URL}" in
            https://*|"http://"*) ;;
            *)
              echo "::error::VITE_SUPABASE_URL must be a valid http(s) URL."
              exit 1
              ;;
          esac

          case "${VITE_SUPABASE_URL}" in
            *your-project-id*)
              echo "::error::VITE_SUPABASE_URL appears to be a placeholder value."
              exit 1
              ;;
          esac

          case "${VITE_SUPABASE_ANON_KEY}" in
            *your-supabase-*)
              echo "::error::VITE_SUPABASE_ANON_KEY appears to be a placeholder value."
              exit 1
              ;;
          esac

          echo "Supabase build secrets verified (present and non-placeholder)."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm install

      - name: Build web bundle with Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
